{{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.webhook.certManager.issuerName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lavinmq-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.webhook.certManager.certificateName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lavinmq-operator.labels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ .Values.webhook.service.name }}.{{ .Release.Namespace }}.svc
    - {{ .Values.webhook.service.name }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ .Values.webhook.certManager.issuerName }}
  secretName: {{ .Values.webhook.certSecretName }}
{{- end }}
