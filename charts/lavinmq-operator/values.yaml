replicaCount: 1

image:
  repository: ghcr.io/saliven/lavinmq-operator
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  name: ""  # defaults to fullname

webhook:
  enabled: false
  certSecretName: webhook-server-cert
  service:
    name: webhook-service
    port: 443
    targetPort: 9443
  certManager:
    enabled: false
    issuerName: selfsigned-issuer
    certificateName: serving-cert

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
